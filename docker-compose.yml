services:
  backend:
    build:
      context: ./backend
    image: scorpion-detector-backend
    volumes:
      - ./models:/app/models:ro
    environment:
      MODEL_PATH: /app/models/best.pt
      HOST: 0.0.0.0
      PORT: "8000"
      # Set to a comma-separated list of allowed origins in production, e.g.:
      # CORS_ORIGINS: "https://your-domain.com,http://localhost:80"
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: scorpion-detector-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
